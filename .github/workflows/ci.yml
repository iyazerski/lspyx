name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    # lspyx ships for Linux and macOS, and the daemon relies on Unix process and file APIs.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v10
      # Integration tests drive the real ty and Ruff.
      - name: Install ty and Ruff
        run: uv tool install ty && uv tool install ruff
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - uses: taiki-e/install-action@v2.90.2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        if: runner.os == 'Linux'
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }
