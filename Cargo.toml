[package]
name = "lspyx"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Python code navigation, rename previews, and ty/Ruff diagnostics for AI coding agents, as an MCP server and CLI"
license = "MIT"
authors = ["Ihar Yazerski"]
repository = "https://github.com/iyazerski/lspyx"
homepage = "https://github.com/iyazerski/lspyx"
readme = "README.md"
keywords = ["mcp", "lsp", "python", "ai-agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/THIRD_PARTY_LICENSES.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.184"
rmcp = { version = "3.7.0", features = ["transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
url = "2.5.8"
which = "8.0.6"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tempfile = "3.27.0"
