[package]
name = "lspyx"
version = "0.5.1"
edition = "2024"
description = "Agent-friendly Python semantic navigation and diagnostics"
license = "MIT"
readme = "README.md"
keywords = ["lsp", "cli", "semantic-navigation", "python", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.184"
rmcp = { version = "3.7.0", features = ["transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
url = "2.5.8"
which = "8.0.6"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
